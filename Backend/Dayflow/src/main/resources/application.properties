spring.application.name=Dayflow

# H2 Database (dev) - switch to MySQL in production
spring.datasource.url=jdbc:h2:mem:dayflowdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT
jwt.secret=DayflowSecretKeyForJWTTokenGenerationMustBeAtLeast256BitsLong2026
jwt.expiration=86400000

# App base URL (used in email verification link)
app.base-url=http://localhost:8080

# Email (optional for dev - verification link is also logged to console)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true